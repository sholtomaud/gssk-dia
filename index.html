<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSSK Diagrammatic Interface (gssk-dia)</title>
    <style>
        :root {
            --top-bar-height: 60px;
            --side-panel-width: 350px;
            --primary-color: #3b82f6;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --header-bg: white;
            --border-color: #e2e8f0;
            --panel-bg: white;
            --control-bg: white;
            --control-text: #475569;
            --chart-grid: #f1f5f9;
            --chart-tick: #94a3b8;
            --chart-axis: #cbd5e1;
            --editor-bg: #f1f5f9;
            --log-bg: #1e293b;
            --log-text: #e2e8f0;
            --panel-header-text: #64748b;
        }

        [data-theme='dark'] {
            --bg-color: #0f172a;
            --text-color: #f1f5f9;
            --header-bg: #1e293b;
            --border-color: #334155;
            --panel-bg: #1e293b;
            --control-bg: #334155;
            --control-text: #e2e8f0;
            --chart-grid: #1e293b;
            --chart-tick: #64748b;
            --chart-axis: #475569;
            --editor-bg: #020617;
            --log-bg: #020617;
            --log-text: #e2e8f0;
            --panel-header-text: #94a3b8;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            height: var(--top-bar-height);
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 24px;
            justify-content: space-between;
            box-sizing: border-box;
            z-index: 100;
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .logo {
            font-weight: 800;
            font-size: 1.25rem;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -0.025em;
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        button {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--control-bg);
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--control-text);
        }

        button:hover {
            background: var(--bg-color);
            border-color: var(--border-color);
            color: var(--text-color);
        }

        button.primary {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        button.primary:hover {
            background: #2563eb;
            box-shadow: 0 4px 6px -1px rgb(59 130 246 / 0.3);
        }

        .main-container {
            display: flex;
            height: calc(100% - var(--top-bar-height));
            width: 100%;
            position: relative;
        }

        #editor-wrapper {
            flex-grow: 1;
            position: relative;
            background: var(--editor-bg);
            overflow: hidden;
            transition: background-color 0.3s;
        }

        gssk-editor {
            width: 100%;
            height: 100%;
            display: block;
        }

        #rhs-panel {
            width: var(--side-panel-width);
            border-left: 1px solid var(--border-color);
            background: var(--panel-bg);
            display: flex;
            flex-direction: column;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s, border-color 0.3s;
            position: relative;
            z-index: 20;
        }

        #rhs-panel.maximized {
            width: 100%;
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
        }

        .side-panel {
            position: absolute;
            top: var(--top-bar-height);
            right: -350px;
            width: 300px;
            height: calc(100% - var(--top-bar-height));
            background: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            z-index: 150;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -4px 0 10px rgb(0 0 0 / 0.1);
            padding: 20px;
            box-sizing: border-box;
        }

        .side-panel.open {
            right: 0;
        }

        .side-panel .panel-header {
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-color);
        }

        .side-panel .prop-group {
            margin-bottom: 20px;
        }

        .side-panel input, .side-panel select {
            width: 100%;
            margin-top: 4px;
        }

        .panel-section {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            font-weight: 600;
            font-size: 0.75rem;
            color: var(--panel-header-text);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #simulation-chart {
            flex-grow: 1;
            min-height: 250px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 16px;
            overflow: hidden;
            transition: background-color 0.3s, border-color 0.3s;
        }

        #log-console {
            height: 200px;
            background: var(--log-bg);
            color: var(--log-text);
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.75rem;
            padding: 12px;
            overflow-y: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        .log-entry {
            margin-bottom: 6px;
            line-height: 1.5;
            border-left: 2px solid transparent;
            padding-left: 8px;
        }

        .log-time { color: #64748b; margin-right: 8px; font-size: 0.7rem; }
        .log-error { color: #f87171; border-left-color: #f87171; }
        .log-info { color: #60a5fa; border-left-color: #60a5fa; }
        .log-success { color: #4ade80; border-left-color: #4ade80; }

        #toggle-rhs {
            position: absolute;
            left: -12px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            background: var(--control-bg);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 30;
            box-shadow: 0 2px 4px rgb(0 0 0 / 0.1);
            color: var(--control-text);
        }

        .invalid-indicator {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #ef4444;
            color: white;
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            box-shadow: 0 4px 6px -1px rgb(239 68 68 / 0.3);
            display: none;
            z-index: 50;
        }

        select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--control-bg);
            font-size: 0.875rem;
            color: var(--text-color);
            outline: none;
            transition: background-color 0.3s, border-color 0.3s, color 0.3s;
        }

        select:focus {
            border-color: var(--primary-color);
            ring: 2px solid var(--primary-color);
        }

        /* Theme Switcher Styles */
        .theme-switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
        }

        .theme-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #cbd5e1;
            transition: .4s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary-color);
        }

        input:checked + .slider:before {
            transform: translateX(18px);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary-color)"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>
            <input type="text" id="model-title" value="Untitled Model" style="background: none; border: 1px solid transparent; color: inherit; font: inherit; font-weight: 800; padding: 4px; border-radius: 4px; width: 200px; outline: none;" title="Click to rename">
        </div>
        <div class="controls">
            <select id="example-select">
                <option value="">Select Model...</option>
                <optgroup label="Examples">
                    <option value="basic">Basic Source-Storage-Sink</option>
                    <option value="predator-prey">Lotka-Volterra</option>
                    <option value="industrial">Industrial Ecosystem</option>
                    <option value="personal-finance">Personal Finance Model</option>
                    <option value="macro-economy">Macro-Economic Model</option>
                    <option value="hydrology">Hydrology (Mock Real-time)</option>
                </optgroup>
                <optgroup label="My Models" id="user-models-group"></optgroup>
            </select>
            <button id="new-model" title="New Model">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
            <button id="delete-model" title="Delete Model" style="color: #ef4444; display: none;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            </button>
            <div style="width: 1px; height: 24px; background: var(--border-color); margin: 0 8px;"></div>
            <button id="connect-data" title="Connect to Data Source">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.59 16.11a6 6 0 0 1 6.82 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
                Connect
            </button>
            <button id="disconnect-data" style="display:none; color: #10b981;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.59 16.11a6 6 0 0 1 6.82 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
                Connected
            </button>
            <div style="width: 1px; height: 24px; background: var(--border-color); margin: 0 8px;"></div>
            <button id="run-sim" class="primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                Run
            </button>
            <button id="stop-sim" style="display:none">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12"/></svg>
                Stop
            </button>
            <button id="reset-sim">Reset</button>
            <div style="width: 1px; height: 24px; background: var(--border-color); margin: 0 8px;"></div>
            <button id="toggle-symbols">Odum Symbols</button>
            <button id="export-json" title="Export to Console">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </button>
            <div style="width: 1px; height: 24px; background: var(--border-color); margin: 0 8px;"></div>
            <button id="generate-article" title="Generate Scientific Article" style="position: relative;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                    <polyline points="14 2 14 8 20 8"></polyline>
                    <line x1="16" y1="13" x2="8" y2="13"></line>
                    <line x1="16" y1="17" x2="8" y2="17"></line>
                    <polyline points="10 9 9 9 8 9"></polyline>
                </svg>
                <span style="position: absolute; top: -5px; right: -5px; font-size: 10px;">✨</span>
            </button>
            <button id="open-library" title="Article Library">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                </svg>
            </button>
            <button id="publish-model" title="Publish Model to Server">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.5 19a3.5 3.5 0 1 1-5.8-3.6 5 5 0 1 1 5.8 3.6Z"/><path d="M12 13v6"/><path d="M9 16l3-3 3 3"/></svg>
            </button>
            <div style="width: 1px; height: 24px; background: var(--border-color); margin: 0 8px;"></div>
            <button id="open-settings">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                Settings
            </button>
            <div style="width: 1px; height: 24px; background: var(--border-color); margin: 0 8px;"></div>
            <div class="theme-switch-wrapper" style="display: flex; align-items: center; gap: 8px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #94a3b8"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                <label class="theme-switch">
                    <input type="checkbox" id="theme-toggle">
                    <span class="slider"></span>
                </label>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #94a3b8"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </div>
        </div>
    </header>

    <div class="main-container">
        <div id="editor-wrapper">
            <div id="invalid-msg" class="invalid-indicator">Invalid Model Configuration</div>
            <div id="sim-error-msg" class="invalid-indicator" style="z-index: 60;">Simulation Error</div>
            <gssk-editor id="editor" symbols="odum"></gssk-editor>
        </div>

    <div id="settings-panel" class="side-panel">
        <div class="panel-header">
            Simulation Settings
            <button id="close-settings" style="padding: 0; border: none; background: none; font-size: 1.5rem; color: var(--text-color); cursor: pointer;">&times;</button>
        </div>
        <div class="panel-content">
            <div class="prop-group">
                <label>Simulation Mode</label>
                <select id="sim-mode">
                    <option value="streaming">Streaming (Real-time)</option>
                    <option value="batch">Batch (All at once)</option>
                </select>
            </div>
            <div class="prop-group">
                <label>Start Time</label>
                <input type="number" id="sim-start-time" value="0" step="0.1">
            </div>
            <div class="prop-group">
                <label>End Time</label>
                <input type="number" id="sim-end-time" value="100" step="1">
            </div>
            <div class="prop-group">
                <label>Time Step (dt)</label>
                <input type="number" id="sim-dt" value="0.1" step="0.01">
            </div>
            <div style="border-top: 1px solid var(--border-color); margin: 20px 0; padding-top: 20px;">
                <label style="font-weight: 600; font-size: 0.75rem; text-transform: uppercase;">AI Integration</label>
            </div>
            <div class="prop-group">
                <label>Gemini API Key</label>
                <input type="password" id="gemini-api-key" placeholder="Enter API Key...">
                <p style="font-size: 0.7rem; color: var(--panel-header-text); margin-top: 4px;">Stored locally in your browser.</p>
            </div>
            <div class="prop-group">
                <label>Gemini Model</label>
                <input type="text" id="gemini-model" value="gemini-3-flash-preview">
            </div>
            <div style="border-top: 1px solid var(--border-color); margin: 20px 0; padding-top: 20px;">
                <label style="font-weight: 600; font-size: 0.75rem; text-transform: uppercase;">Domain & Data</label>
            </div>
            <div class="prop-group">
                <label>Import Domain (JSON)</label>
                <input type="file" id="import-domain" accept=".json">
            </div>
            <div class="prop-group">
                <label>Import Historical Data (CSV/JSON)</label>
                <input type="file" id="import-historical" accept=".csv,.json">
            </div>
            <div style="border-top: 1px solid var(--border-color); margin: 20px 0; padding-top: 20px;">
                <label style="font-weight: 600; font-size: 0.75rem; text-transform: uppercase;">Data Source Configuration</label>
            </div>
            <div class="prop-group">
                <label>API URL (REST/WS)</label>
                <input type="text" id="ds-api-url" placeholder="https://api... or ws://...">
            </div>
            <div class="prop-group">
                <label>Source Name</label>
                <input type="text" id="ds-name" placeholder="Hydstra, etc.">
            </div>
            <div class="prop-group">
                <label>API Key Variable Name</label>
                <input type="text" id="ds-api-key-name" placeholder="X-API-KEY">
            </div>
            <div class="prop-group">
                <label>Provider Name</label>
                <input type="text" id="ds-provider" placeholder="Bureau of Meteorology">
            </div>
            <button id="test-connection" style="width: 100%; justify-content: center; margin-top: 10px;">Test Connection</button>
        </div>
    </div>

    <div id="library-modal" class="side-panel">
        <div class="panel-header">
            Article Library
            <button id="close-library" style="padding: 0; border: none; background: none; font-size: 1.5rem; color: var(--text-color); cursor: pointer;">&times;</button>
        </div>
        <div class="panel-content" id="library-content">
            <p style="color: var(--panel-header-text); font-size: 0.875rem;">No articles generated yet.</p>
        </div>
    </div>

    <aside id="rhs-panel">
        <div id="toggle-rhs">&rsaquo;</div>
            <div class="panel-section" id="fitness-section" style="height: 150px; min-height: 100px;">
                <div class="panel-header">
                    Fitness Metrics
                </div>
                <div id="fitness-metrics" style="font-size: 0.8rem; overflow-y: auto;">
                    <p style="color: var(--panel-header-text);">No data mappings active.</p>
                </div>
            </div>
            <div class="panel-section" id="log-section" style="height: 250px; min-height: 100px;">
                <div class="panel-header" id="log-header" style="cursor: ns-resize;">
                    Log Console
                    <button id="maximize-rhs" style="padding: 4px 8px; font-size: 0.65rem;">Maximize</button>
                </div>
                <div id="log-console" style="flex-grow: 1;">
                    <div class="log-entry"><span class="log-time">00:00:00</span> <span class="log-info">System ready.</span></div>
                </div>
            </div>
            <div class="panel-section" style="flex-grow: 1;">
                <div class="panel-header">
                    Simulation Results (Time-Series)
                </div>
                <div id="simulation-chart">
                    <svg id="chart-svg" width="100%" height="100%"></svg>
                </div>
            </div>
        </aside>
    </div>

    <script type="module" src="./src/gssk-editor.js"></script>
    <script type="module">
        import createGSSK from 'gssk';

                    Object.assign(observedData, data);
                } else if (file.name.endsWith('.csv')) {
                    const lines = text.split('\n');
                    const header = lines[0].split(',');
                    // CSV format: time,dataType1,dataType2...
                    for (let i = 1; i < lines.length; i++) {
                        const row = lines[i].split(',');
                        if (row.length < 2) continue;
                        const t = parseFloat(row[0]);
                        for (let j = 1; j < header.length; j++) {

        async function fetchData() {
            const model = editor.getJson();
            const ds = model.metadata?.datasource || {};
            const sourceName = ds.name || 'Data Source';

            // Simulate network delay
            await new Promise(r => setTimeout(r, 500));

            const data = {
                'Rainfall': (Math.random() * 5),
                'WaterLevel': (30 + Math.random() * 40),
                'Flow': (10 + Math.random() * 20),
                'Evaporation': (Math.random() * 2)
            };

            processIncomingData(data, sourceName);
        }

        function processIncomingData(data, sourceName) {
            const model = editor.getJson();
            let changed = false;

            model.nodes.forEach(n => {
                if (n.dataType && data[n.dataType] !== undefined) {
                    n.value = data[n.dataType];
                    n.currentValue = data[n.dataType];
                    changed = true;

                    if (!observedData[n.dataType]) observedData[n.dataType] = [];
                    const timestamp = isSimulating ? simTime : (observedData[n.dataType].length * (parseFloat(simDtInput.value) || 0.1));
                    observedData[n.dataType].push({ t: timestamp, v: data[n.dataType] });
                }
            });

            if (changed) {
                editor.updateState(model.nodes.reduce((acc, n) => {
                    acc[n.id] = n.currentValue;
                    return acc;
                }, {}));

                let logMsg = `${sourceName} Update: ` + Object.entries(data).map(([k, v]) => `${k}=${v.toFixed(2)}`).join(', ');
                log(logMsg, 'success');

                if (isSimulating && kernelPtr) {
                    model.nodes.forEach(n => {
                        if (n.dataType && data[n.dataType] !== undefined) {
                            const size = gsskModule._GSSK_GetStateSize(kernelPtr);
                            for (let i = 0; i < size; i++) {
                                const idPtr = gsskModule._GSSK_GetNodeID(kernelPtr, i);
                                const id = gsskModule.UTF8ToString(idPtr);
                                if (id === n.id) {
                                    const statePtr = gsskModule._GSSK_GetState(kernelPtr);
                                    gsskModule.HEAPF64[(statePtr / 8) + i] = n.currentValue;
                                }
                            }
                        }
                    });
                }

                if (!isSimulating) {
                    updateChart();
                }
            }
        }

        function connectData() {

                log('Cannot connect: No API URL defined in model metadata.', 'error');
                settingsPanel.classList.add('open');
                return;
            }

            log(`Connecting to ${ds.apiUrl}...`, 'info');
            connectBtn.style.display = 'none';
            disconnectBtn.style.display = 'flex';

            if (ds.apiUrl.startsWith('ws://') || ds.apiUrl.startsWith('wss://')) {
                log('Establishing WebSocket connection (mock)...', 'info');
                mockSocket = setInterval(() => {
                    const data = {
                        'Rainfall': (Math.random() * 5),
                        'WaterLevel': (30 + Math.random() * 40)
                    };
                    processIncomingData(data, ds.name || 'WebSocket');
                }, 3000);
            } else {
                log('Starting REST polling (5s interval)...', 'info');
                fetchData();
                connectionInterval = setInterval(fetchData, 5000);
            }
        }

        function disconnectData() {
            if (connectionInterval) clearInterval(connectionInterval);
            if (mockSocket) clearInterval(mockSocket);
            connectionInterval = null;
            mockSocket = null;
            connectBtn.style.display = 'flex';
            disconnectBtn.style.display = 'none';
            log('Disconnected from data source.');

                exampleSelect.dispatchEvent(new Event('change'));
                log('Model deleted.');
            }
        });

        function loadModelWithConfig(model) {
            editor.loadModel(model);
            if (model.config) {
                if (model.config.t_start !== undefined) simStartTimeInput.value = model.config.t_start;
                if (model.config.t_end !== undefined) simEndTimeInput.value = model.config.t_end;
                if (model.config.dt !== undefined) simDtInput.value = model.config.dt;
            }
            updateDataSourceUI(model.metadata);
        }

        // Initial setup
        updateModelSelect();
        loadModelWithConfig(EXAMPLES.basic);
        modelTitleInput.value = 'Basic Source-Storage-Sink';

        let gsskModule;
        let kernelPtr = 0;
        let isSimulating = false;
        let simInterval = null;
        let chartData = [];
        let simTime = 0;
        let storageNodeIds = new Set();
        let loggedMissingNodes = new Set();

        async function initGssk() {
            try {
                gsskModule = await createGSSK({
                    locateFile: (path) => path.endsWith('.wasm') ? gsskUrl : path
                });
                log('GSSK WASM Runtime loaded.', 'success');
            } catch (e) {
                log('Failed to load GSSK WASM: ' + e.message, 'error');
            }
        }
        initGssk();

        editor.addEventListener('change', (e) => {
            const isInvalid = editor.hasAttribute('invalid');
            invalidMsg.style.display = isInvalid ? 'block' : 'none';
            if (isSimulating) stopSimulation();
            autoSave();
        });

        editor.addEventListener('validation', (e) => {
            const result = e.detail;
            if (!result.valid) {
                log('Model Validation Error:', 'error');
                result.errors.forEach(err => {
                    log(`- ${err.instancePath} ${err.message}`, 'error');
                });
            } else {
                log('Model configuration is valid.', 'success');
            }
        });

        runBtn.addEventListener('click', startSimulation);
        stopBtn.addEventListener('click', stopSimulation);
        resetBtn.addEventListener('click', resetSimulation);

        function cleanModelForKernel(model) {
            return {
                nodes: model.nodes.map(n => ({
                    id: n.id,
                    type: n.type,
                    value: n.value
                })),
                edges: model.edges.map(e => {
                    const cleanEdge = {
                        id: e.id,
                        origin: e.origin,
                        target: e.target,
                        logic: e.logic,
                        params: { k: e.params?.k ?? 0.1 }
                    };
                    const controlNode = e.params?.control_node || e.control_node;
                    if (controlNode) {
                        cleanEdge.params.control_node = controlNode;
                    }
                    if (e.params?.threshold !== undefined) {
                        cleanEdge.params.threshold = e.params.threshold;
                    }
                    return cleanEdge;
                }),
                config: model.config,
                metadata: model.metadata
            };
        }

        function showSimError(message) {
            simErrorMsg.textContent = message;
            simErrorMsg.style.display = 'block';
        }

        function hideSimError() {
            simErrorMsg.style.display = 'none';
        }

        function startSimulation() {
            hideSimError();
            // Reset live observed data if not continuing
            if (simTime === 0) {
                // Clear observed data for a fresh run
                observedData = {};
            }
            if (editor.hasAttribute('invalid')) {
                log('Cannot run simulation: Model is invalid.', 'error');
                return;
            }

            try {
                const model = editor.getJson();
                // Apply config from UI
                if (!model.config) model.config = {};
                model.config.t_start = parseFloat(simStartTimeInput.value);
                model.config.t_end = parseFloat(simEndTimeInput.value);
                model.config.dt = parseFloat(simDtInput.value);

                const cleanModel = cleanModelForKernel(model);
                const jsonStr = JSON.stringify(cleanModel);

                const bytes = gsskModule.lengthBytesUTF8(jsonStr) + 1;
                const ptr = gsskModule._malloc(bytes);
                gsskModule.stringToUTF8(jsonStr, ptr, bytes);

                if (kernelPtr) gsskModule._GSSK_Free(kernelPtr);

                const outInstPtr = gsskModule._malloc(4);
                const status = gsskModule._GSSK_Init(ptr, outInstPtr);

                if (status !== 0) {
                    const errInstPtr = gsskModule.HEAP32[outInstPtr / 4];
                    let errMsg = 'Unknown error';
                    if (errInstPtr) {
                        const errPtr = gsskModule._GSSK_GetErrorDescription(errInstPtr);
                        errMsg = gsskModule.UTF8ToString(errPtr);
                        gsskModule._GSSK_Free(errInstPtr);
                    }
                    gsskModule._free(ptr);
                    gsskModule._free(outInstPtr);
                    throw new Error(`Kernel initialization failed (${status}): ${errMsg}`);
                }

                kernelPtr = gsskModule.HEAP32[outInstPtr / 4];
                gsskModule._free(ptr);
                gsskModule._free(outInstPtr);

                chartData = [];
                simTime = model.config.t_start;
                storageNodeIds = new Set(model.nodes.filter(n => n.type === 'storage').map(n => n.id));
                loggedMissingNodes = new Set();

                const mode = simModeSelect.value;
                if (mode === 'batch') {
                    runBatch(model.config);
                } else {
                    log('Simulation started (streaming).', 'success');
                    isSimulating = true;
                    runBtn.style.display = 'none';
                    stopBtn.style.display = 'flex';
                    simInterval = setInterval(() => step(model.config.dt, model.config.t_end), 50);
                }
            } catch (e) {
                log('Simulation error: ' + e.message, 'error');
            }
        }

        function runBatch(settings) {
            log('Running batch simulation...', 'info');
            const dt = settings.dt;
            const t_end = settings.t_end;

            while (simTime < t_end) {
                const status = gsskModule._GSSK_Step(kernelPtr, dt);
                if (status !== 0) {
                    const errPtr = gsskModule._GSSK_GetErrorDescription(kernelPtr);
                    const errMsg = gsskModule.UTF8ToString(errPtr);
                    const msg = `Simulation failed at t=${simTime.toFixed(2)}: ${errMsg}`;
                    log(msg, 'error');
                    showSimError(msg);
                    break;
                }
                simTime += dt;
                if (!recordState(simTime)) break;
            }

            updateVisualsFromState();
            updateChart();
            log('Batch simulation complete.', 'success');
        }

        function step(dt, t_end) {
            if (!isSimulating || !kernelPtr) return;

            updateFitnessUI();

            const status = gsskModule._GSSK_Step(kernelPtr, dt);
            if (status !== 0) {
                const errPtr = gsskModule._GSSK_GetErrorDescription(kernelPtr);
                const errMsg = gsskModule.UTF8ToString(errPtr);
                const msg = `Simulation failed at t=${simTime.toFixed(2)}: ${errMsg}`;
                log(msg, 'error');
                showSimError(msg);
                stopSimulation();
                return;
            }
            simTime += dt;

            updateVisualsFromState();
            if (!recordState(simTime)) return;
            updateChart();

            if (simTime >= t_end) {
                stopSimulation();
                log('Simulation reached end time.', 'success');
            }
        }

        function recordState(time) {
            const statePtr = gsskModule._GSSK_GetState(kernelPtr);
            const size = gsskModule._GSSK_GetStateSize(kernelPtr);
            const state = gsskModule.HEAPF64.subarray(statePtr / 8, statePtr / 8 + size);

            const entry = { time };
            const recordedIds = new Set();
            for (let i = 0; i < size; i++) {
                const idPtr = gsskModule._GSSK_GetNodeID(kernelPtr, i);
                const id = gsskModule.UTF8ToString(idPtr);
                if (storageNodeIds.has(id)) {
                    entry[id] = state[i];
                    recordedIds.add(id);
                }
            }

            let missingNode = false;
            storageNodeIds.forEach(id => {
                if (!recordedIds.has(id) && !loggedMissingNodes.has(id)) {
                    const msg = `CRITICAL ERROR: Storage node '${id}' is defined in the editor but missing from simulation kernel state.`;
                    log(msg, 'error');
                    loggedMissingNodes.add(id);
                    showSimError(msg);
                    stopSimulation();
                    missingNode = true;
                }
            });

            if (missingNode) return false;

            chartData.push(entry);
            return true;
        }

        function updateVisualsFromState() {
            const statePtr = gsskModule._GSSK_GetState(kernelPtr);
            const size = gsskModule._GSSK_GetStateSize(kernelPtr);
            const state = gsskModule.HEAPF64.subarray(statePtr / 8, statePtr / 8 + size);

            const stateMap = {};
            for (let i = 0; i < size; i++) {
                const idPtr = gsskModule._GSSK_GetNodeID(kernelPtr, i);
                const id = gsskModule.UTF8ToString(idPtr);
                stateMap[id] = state[i];
            }
            editor.updateState(stateMap);
        }

        function stopSimulation() {
            isSimulating = false;
            clearInterval(simInterval);
            runBtn.style.display = 'flex';
            stopBtn.style.display = 'none';
            log('Simulation stopped.');
        }

        function resetSimulation() {
            hideSimError();
            stopSimulation();
            if (kernelPtr) {
                gsskModule._GSSK_Free(kernelPtr);
                kernelPtr = 0;
            }
            log('Simulation reset.');
            // Reload model to editor to reset values
            editor.loadModel(editor.getJson());
            chartData = [];
            updateChart();
        }

        // --- Charting Logic ---
        const chartSvg = document.getElementById('chart-svg');
        function updateChart() {
            if (chartData.length === 0 && Object.keys(observedData).length === 0) {
                chartSvg.innerHTML = '';
                return;
            }

            const width = chartSvg.clientWidth || 300;
            const height = chartSvg.clientHeight || 250;
            const padding = 30;

            const model = editor.getJson();
            const storageNodes = model.nodes.filter(n => n.type === 'storage');
            if (storageNodes.length === 0) return;

            let minX = 0;
            let lastSimTime = chartData.length > 0 ? chartData[chartData.length - 1].time : 0;
            let lastObsTime = 0;
            Object.values(observedData).forEach(obs => {
                if (obs.length > 0 && obs[obs.length - 1].t > lastObsTime) lastObsTime = obs[obs.length - 1].t;
            });

            let maxX = Math.max(1, lastSimTime, lastObsTime);
            let minY = 0;
            let maxY = 0;

            chartData.forEach(d => {
                storageNodes.forEach(n => {
                    if (d[n.id] > maxY) maxY = d[n.id];
                });
            });
            Object.values(observedData).forEach(obs => {
                obs.forEach(d => {
                    if (d.v > maxY) maxY = d.v;
                });
            });
            if (maxY === 0) maxY = 100;
            maxY *= 1.1;

            const scaleX = (x) => padding + (x - minX) / (maxX - minX || 1) * (width - 2 * padding);
            const scaleY = (y) => height - padding - (y / maxY) * (height - 2 * padding);

            let html = '';

            // Grid lines
            const ticks = 5;
            for (let i = 0; i <= ticks; i++) {
                const y = padding + i * (height - 2 * padding) / ticks;
                const val = (maxY * (ticks - i) / ticks).toFixed(1);
                html += `
                    <line x1="${padding}" y1="${y}" x2="${width - padding}" y2="${y}" stroke="var(--chart-grid)" stroke-width="1" />
                    <text x="${padding - 5}" y="${y + 3}" text-anchor="end" font-size="8" fill="var(--chart-tick)">${val}</text>
                `;
            }

            html += `
                <line x1="${padding}" y1="${height - padding}" x2="${width - padding}" y2="${height - padding}" stroke="var(--chart-axis)" />
                <line x1="${padding}" y1="${padding}" x2="${padding}" y2="${height - padding}" stroke="var(--chart-axis)" />
                <text x="${width/2}" y="${height - 5}" text-anchor="middle" font-size="10" fill="var(--chart-tick)">Time (s)</text>
            `;

            const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'];
            storageNodes.forEach((n, i) => {
                const color = colors[i % colors.length];
                let points = chartData
                    .filter(d => d[n.id] !== undefined)
                    .map(d => `${scaleX(d.time)},${scaleY(d[n.id])}`)
                    .join(' ');
                html += `<polyline points="${points}" fill="none" stroke="${color}" stroke-width="2" />`;

                // Add observed data to chart if available
                if (n.dataType && observedData[n.dataType]) {
                    const obsPoints = observedData[n.dataType]
                        .map(d => `${scaleX(d.t)},${scaleY(d.v)}`)
                        .join(' ');
                    html += `<polyline points="${obsPoints}" fill="none" stroke="${color}" stroke-width="1" stroke-dasharray="2,2" opacity="0.6" />`;
                }

                html += `<text x="${padding + 5}" y="${padding + 12 * (i + 1)}" fill="${color}" font-size="10" font-weight="600">${n.visual.label || n.id}</text>`;
            });

            chartSvg.innerHTML = html;
        }

        window.addEventListener('resize', updateChart);

        // --- Fitness Dashboard Logic ---
        function calculateFitness(nodeId, dataType) {
            const observed = observedData[dataType];
            if (!observed || observed.length < 2) return null;

            // Align simulated data with observed data by time
            const pairs = [];
            observed.forEach(obs => {
                // Find nearest simulated point
                const sim = chartData.reduce((prev, curr) => {
                    return Math.abs(curr.time - obs.t) < Math.abs(prev.time - obs.t) ? curr : prev;
                }, chartData[0]);

                if (sim && sim[nodeId] !== undefined) {
                    pairs.push({ actual: obs.v, sim: sim[nodeId] });
                }
            });

            if (pairs.length < 2) return null;

            const n = pairs.length;
            const sumA = pairs.reduce((s, p) => s + p.actual, 0);
            const sumS = pairs.reduce((s, p) => s + p.sim, 0);
            const meanA = sumA / n;
            const meanS = sumS / n;

            const ssTot = pairs.reduce((s, p) => s + Math.pow(p.actual - meanA, 2), 0);
            const ssRes = pairs.reduce((s, p) => s + Math.pow(p.actual - p.sim, 2), 0);
            const r2 = ssTot === 0 ? 0 : 1 - (ssRes / ssTot);

            const chi2 = pairs.reduce((s, p) => s + (p.actual === 0 ? 0 : Math.pow(p.actual - p.sim, 2) / p.actual), 0);

            // Simple p-value approximation (1-tailed t-test)
            // This is a placeholder for a more complex distribution function
            const pVal = Math.max(0, Math.min(1, 1 - r2));

            return { r2, chi2, pVal, n };
        }

        function updateFitnessUI() {
            const model = editor.getJson();
            const storageNodes = model.nodes.filter(n => n.type === 'storage' && n.dataType);

            if (storageNodes.length === 0) {
                fitnessMetricsDiv.innerHTML = '<p style="color: var(--panel-header-text);">No data mappings active.</p>';
                return;
            }

            let html = '';
            const fitnessResults = {};

            storageNodes.forEach(node => {
                const stats = calculateFitness(node.id, node.dataType);
                if (stats) {
                    const color = stats.r2 > 0.8 ? '#4ade80' : stats.r2 > 0.5 ? '#f59e0b' : '#f87171';
                    html += `
                        <div style="margin-bottom: 12px; padding: 8px; border: 1px solid var(--border-color); border-radius: 6px;">
                            <div style="font-weight: 600; color: ${color}">${node.visual.label || node.id}</div>
                            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 4px;">
                                <span>R²: ${stats.r2.toFixed(4)}</span>
                                <span>χ²: ${stats.chi2.toFixed(2)}</span>
                                <span>p: ${stats.pVal.toFixed(4)}</span>
                                <span>n: ${stats.n}</span>
                            </div>
                        </div>
                    `;
                    fitnessResults[node.id] = stats;
                }
            });

            if (html === '') {
                fitnessMetricsDiv.innerHTML = '<p style="color: var(--panel-header-text);">Collecting data...</p>';
            } else {
                fitnessMetricsDiv.innerHTML = html;
            }

            // Push fitness results to editor for badges
            editor.updateState(model.nodes.reduce((acc, n) => {
                acc[n.id] = n.currentValue;
                return acc;
            }, {}), fitnessResults);
        }

        async function getChartImage() {
            const originalSvg = document.getElementById('chart-svg');
            const svg = originalSvg.cloneNode(true);
            const width = originalSvg.clientWidth || 600;
            const height = originalSvg.clientHeight || 400;

            svg.setAttribute('width', width);
            svg.setAttribute('height', height);

            // Resolve CSS variables
            const style = getComputedStyle(document.documentElement);
            const bgColor = style.getPropertyValue('--bg-color').trim() || '#f8fafc';
            const gridColor = style.getPropertyValue('--chart-grid').trim() || '#f1f5f9';
            const tickColor = style.getPropertyValue('--chart-tick').trim() || '#94a3b8';
            const axisColor = style.getPropertyValue('--chart-axis').trim() || '#cbd5e1';

            // Apply styles directly to elements in the clone
            svg.querySelectorAll('line').forEach(el => {
                const stroke = el.getAttribute('stroke');
                if (stroke === 'var(--chart-grid)') el.setAttribute('stroke', gridColor);
                if (stroke === 'var(--chart-axis)') el.setAttribute('stroke', axisColor);
            });
            svg.querySelectorAll('text').forEach(el => {
                const fill = el.getAttribute('fill');
                if (fill === 'var(--chart-tick)') el.setAttribute('fill', tickColor);
            });

            const svgData = new XMLSerializer().serializeToString(svg);
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');

            const img = new Image();
            const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(svgBlob);

            return new Promise((resolve, reject) => {
                img.onload = () => {
                    ctx.fillStyle = bgColor;
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    ctx.drawImage(img, 0, 0);
                    URL.revokeObjectURL(url);
                    resolve(canvas.toDataURL('image/png'));
                };
                img.onerror = (e) => {
                    URL.revokeObjectURL(url);
                    reject(e);
                };
                img.src = url;
            });
        }

        async function callGeminiForArticle() {
            const apiKey = localStorage.getItem('gssk_gemini_api_key');
            if (!apiKey) {
                throw new Error('API Key missing. Please set it in Settings.');
            }

            const modelName = localStorage.getItem('gssk_gemini_model') || 'gemini-3-flash-preview';
            const ai = new GoogleGenAI({ apiKey });

            const gsskModel = editor.getJson();

            // Calculate simulation statistics for interpretation
            const stats = {};
            if (chartData.length > 0) {
                const storageNodes = gsskModel.nodes.filter(n => n.type === 'storage');
                storageNodes.forEach(node => {
                    const values = chartData.map(d => d[node.id]).filter(v => v !== undefined);
                    if (values.length > 0) {
                        stats[node.id] = {
                            min: Math.min(...values).toFixed(4),
                            max: Math.max(...values).toFixed(4),
                            mean: (values.reduce((a, b) => a + b, 0) / values.length).toFixed(4),
                            final: values[values.length - 1].toFixed(4)
                        };
                    }
                });
            }

            const chartImgDataUrl = chartData.length > 0 ? await getChartImage() : null;

            const prompt = `
                You are a senior scientist. Generate a structured scientific article based on the following GSSK system model and simulation data.

                MODEL JSON:
                ${JSON.stringify(gsskModel, null, 2)}

                SIMULATION STATISTICS:
                ${JSON.stringify(stats, null, 2)}

                Requirements:
                - Use professional academic language.
                - Describe the interaction between nodes and edges based on the MODEL JSON.
                - Analyze the stability or trends in the results using the SIMULATION STATISTICS and the provided chart image.
                - Keywords should be relevant to the domain (e.g., ecology, finance, hydrology).
            `;

            const parts = [{ text: prompt }];
            if (chartImgDataUrl) {
                const base64Data = chartImgDataUrl.split(',')[1];
                parts.push({
                    inlineData: {
                        mimeType: "image/png",
                        data: base64Data
                    }
                });
            }

            let response;
            try {
                const schema = zodToJsonSchema(ArticleSchema);
                delete schema.$schema;

                response = await ai.models.generateContent({
                    model: modelName,
                    contents: [{ role: 'user', parts }],
                    config: {
                        responseMimeType: "application/json",
                        responseJsonSchema: schema,
                    },
                });
            } catch (apiError) {
                console.error("--- LLM REQUEST ERROR ---");
                console.log("PROMPT:", prompt);
                console.log("HAS IMAGE:", !!chartImgDataUrl);
                throw apiError;
            }

            const text = response.text || (response.response && typeof response.response.text === 'function' ? response.response.text() : response.text);

            try {
                const parsedJson = JSON.parse(text);
                return ArticleSchema.parse(parsedJson);
            } catch (error) {
                console.error("--- LLM RESPONSE ERROR ---");
                console.log("PROMPT:", prompt);
                console.log("HAS IMAGE:", !!chartImgDataUrl);
                console.log("RAW RESPONSE:", text);
                if (error instanceof z.ZodError) {
                    console.log("ZOD ERRORS:", JSON.stringify(error.issues, null, 2));
                } else if (error instanceof SyntaxError) {
                    console.error("JSON Syntax Error:", error.message);
                }
                throw error;
            }
        }

        // --- IndexedDB Setup ---
        const DB_NAME = 'GSSK_Library';
        const DB_VERSION = 1;
        const STORE_NAME = 'articles';

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                    }
                };
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        async function saveArticle(article) {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.add(article);
                request.onsuccess = () => resolve();
                request.onerror = (e) => reject(e.target.error);
            });
        }

        async function getArticles() {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readonly');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.getAll();
                request.onsuccess = (e) => resolve(e.target.result);
                request.onerror = (e) => reject(e.target.error);
            });
        }

        async function deleteArticle(id) {
            const db = await initDB();
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const request = store.delete(id);
                request.onsuccess = () => resolve();
                request.onerror = (e) => reject(e.target.error);
            });
        }

            const abstractLines = doc.splitTextToSize(data.abstract, 170);
            doc.text(abstractLines, 20, y);
            y += abstractLines.length * 5 + 10;

            doc.setFontSize(14);
            doc.setFont("helvetica", "bold");
            doc.text("System Diagram", 20, y);
            y += 5;
            doc.addImage(diagramImg, 'PNG', 20, y, 170, 100);
            y += 110;

            if (y > 250) { doc.addPage(); y = 20; }
            doc.setFontSize(14);
            doc.setFont("helvetica", "bold");
            doc.text("1. Introduction", 20, y);
            y += 7;
            doc.setFontSize(11);
            doc.setFont("helvetica", "normal");
            const introLines = doc.splitTextToSize(data.introduction, 170);
            doc.text(introLines, 20, y);
            y += introLines.length * 5 + 10;

            if (y > 250) { doc.addPage(); y = 20; }
            doc.setFontSize(14);
            doc.setFont("helvetica", "bold");
            doc.text("2. Methodology", 20, y);
            y += 7;
            doc.setFontSize(11);
            doc.setFont("helvetica", "normal");
            const methLines = doc.splitTextToSize(data.methodology, 170);
            doc.text(methLines, 20, y);
            y += methLines.length * 5 + 10;

            if (y > 250) { doc.addPage(); y = 20; }
            doc.setFontSize(14);
            doc.setFont("helvetica", "bold");
            doc.text("3. Simulation Results", 20, y);
            y += 7;

            if (chartImg) {
                if (y > 200) { doc.addPage(); y = 20; }
                doc.addImage(chartImg, 'PNG', 20, y, 170, 80);
                y += 90;
            }

            if (y > 270) { doc.addPage(); y = 20; }
            doc.setFontSize(11);
            doc.setFont("helvetica", "normal");
            const resultLines = doc.splitTextToSize(data.results, 170);
            doc.text(resultLines, 20, y);
            y += resultLines.length * 5 + 10;

            if (y > 250) { doc.addPage(); y = 20; }
            doc.setFontSize(14);
            doc.setFont("helvetica", "bold");
            doc.text("4. Discussion", 20, y);
            y += 7;
            doc.setFontSize(11);
            doc.setFont("helvetica", "normal");
            const discLines = doc.splitTextToSize(data.discussion, 170);
            doc.text(discLines, 20, y);
            y += discLines.length * 5 + 10;

            if (y > 250) { doc.addPage(); y = 20; }
            doc.setFontSize(14);
            doc.setFont("helvetica", "bold");
            doc.text("5. Conclusion", 20, y);
            y += 7;
            doc.setFontSize(11);
            doc.setFont("helvetica", "normal");
            const concLines = doc.splitTextToSize(data.conclusion, 170);
            doc.text(concLines, 20, y);

            const pdfBlob = doc.output('blob');
            const reader = new FileReader();
            return new Promise((resolve) => {
                reader.onloadend = async () => {
                    await saveArticle({
                        title: data.title,
                        date: new Date().toISOString(),
                        pdf: reader.result
                    });
                    resolve();
                };
                reader.readAsDataURL(pdfBlob);
            });
        }

        // --- Library Management ---
        async function updateLibraryList() {
            const articles = await getArticles();
            if (articles.length === 0) {
                libraryContent.innerHTML = '<p style="color: var(--panel-header-text); font-size: 0.875rem;">No articles generated yet.</p>';
                return;
            }

            libraryContent.innerHTML = '';
            articles.sort((a, b) => new Date(b.date) - new Date(a.date)).forEach(art => {
                const item = document.createElement('div');
                item.style.padding = '12px';
                item.style.border = '1px solid var(--border-color)';
                item.style.borderRadius = '8px';
                item.style.marginBottom = '12px';
                item.style.display = 'flex';
                item.style.flexDirection = 'column';
                item.style.gap = '8px';

                const title = document.createElement('div');
                title.style.fontWeight = '600';
                title.style.fontSize = '0.9rem';
                title.textContent = art.title;
                item.appendChild(title);

                const date = document.createElement('div');
                date.style.fontSize = '0.7rem';
                date.style.color = 'var(--panel-header-text)';
                date.textContent = new Date(art.date).toLocaleString();
                item.appendChild(date);

                const actions = document.createElement('div');
                actions.style.display = 'flex';
                actions.style.gap = '8px';

                const viewBtn = document.createElement('button');
                viewBtn.textContent = 'Open PDF';
                viewBtn.style.fontSize = '0.75rem';
                viewBtn.addEventListener('click', () => {
                    const win = window.open();
                    win.document.write(`<iframe src="${art.pdf}" frameborder="0" style="border:0; top:0px; left:0px; bottom:0px; right:0px; width:100%; height:100%;" allowfullscreen></iframe>`);
                });
                actions.appendChild(viewBtn);

                const delBtn = document.createElement('button');
                delBtn.textContent = 'Delete';
                delBtn.style.fontSize = '0.75rem';
                delBtn.style.color = '#ef4444';
                delBtn.addEventListener('click', async () => {
                    if (confirm('Delete this article?')) {
                        await deleteArticle(art.id);
                        updateLibraryList();
                    }
                });
                actions.appendChild(delBtn);

                item.appendChild(actions);
                libraryContent.appendChild(item);
            });
        }

        generateArticleBtn.addEventListener('click', async () => {
            if (generateArticleBtn.disabled) return;

            try {
                const apiKey = localStorage.getItem('gssk_gemini_api_key');
                if (!apiKey) {
                    alert('Please enter your Gemini API Key in Settings first.');
                    settingsPanel.classList.add('open');
                    return;
                }

                generateArticleBtn.disabled = true;
                generateArticleBtn.style.opacity = '0.5';
                log('Generating scientific article with Gemini AI...', 'info');

                const articleData = await callGeminiForArticle();
                log('AI Content generated successfully.', 'success');

                log('Capturing model visuals...', 'info');
                const diagramImg = await editor.getDiagramImage();
                const chartImg = chartData.length > 0 ? await getChartImage() : null;

                log('Assembling PDF...', 'info');
                await createAndSavePDF(articleData, diagramImg, chartImg);

                log('Article generation complete!', 'success');
                updateLibraryList();
            } catch (e) {
                let errorMsg = e.message;
                if (e instanceof z.ZodError) {
                    errorMsg = 'Validation Error: ' + e.issues.map(err => `${err.path.join('.')}: ${err.message}`).join('; ');
                }
                log('Article generation failed: ' + errorMsg, 'error');
                console.error(e);
            } finally {
                generateArticleBtn.disabled = false;
                generateArticleBtn.style.opacity = '1';
            }
        });
    </script>
</body>
</html>
