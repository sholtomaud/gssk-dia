<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSSK Diagrammatic Interface (gssk-dia)</title>
    <style>
        :root {
            --top-bar-height: 60px;
            --side-panel-width: 350px;
            --primary-color: #3b82f6;
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --header-bg: white;
            --border-color: #e2e8f0;
            --panel-bg: white;
            --control-bg: white;
            --control-text: #475569;
            --chart-grid: #f1f5f9;
            --chart-tick: #94a3b8;
            --chart-axis: #cbd5e1;
            --editor-bg: #f1f5f9;
            --log-bg: #1e293b;
            --log-text: #e2e8f0;
            --panel-header-text: #64748b;
        }

        [data-theme='dark'] {
            --bg-color: #0f172a;
            --text-color: #f1f5f9;
            --header-bg: #1e293b;
            --border-color: #334155;
            --panel-bg: #1e293b;
            --control-bg: #334155;
            --control-text: #e2e8f0;
            --chart-grid: #1e293b;
            --chart-tick: #64748b;
            --chart-axis: #475569;
            --editor-bg: #020617;
            --log-bg: #020617;
            --log-text: #e2e8f0;
            --panel-header-text: #94a3b8;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            height: var(--top-bar-height);
            background: var(--header-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 24px;
            justify-content: space-between;
            box-sizing: border-box;
            z-index: 100;
            box-shadow: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .logo {
            font-weight: 800;
            font-size: 1.25rem;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: -0.025em;
        }

        .controls {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        button {
            padding: 8px 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--control-bg);
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--control-text);
        }

        button:hover {
            background: var(--bg-color);
            border-color: var(--border-color);
            color: var(--text-color);
        }

        button.primary {
            background: var(--primary-color);
            color: white;
            border-color: var(--primary-color);
        }

        button.primary:hover {
            background: #2563eb;
            box-shadow: 0 4px 6px -1px rgb(59 130 246 / 0.3);
        }

        .main-container {
            display: flex;
            height: calc(100% - var(--top-bar-height));
            width: 100%;
            position: relative;
        }

        #editor-wrapper {
            flex-grow: 1;
            position: relative;
            background: var(--editor-bg);
            overflow: hidden;
            transition: background-color 0.3s;
        }

        gssk-editor {
            width: 100%;
            height: 100%;
            display: block;
        }

        #rhs-panel {
            width: var(--side-panel-width);
            border-left: 1px solid var(--border-color);
            background: var(--panel-bg);
            display: flex;
            flex-direction: column;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.3s, border-color 0.3s;
            position: relative;
            z-index: 20;
        }

        #rhs-panel.maximized {
            width: 100%;
            position: absolute;
            right: 0;
            top: 0;
            bottom: 0;
        }

        .side-panel {
            position: absolute;
            top: var(--top-bar-height);
            right: -350px;
            width: 300px;
            height: calc(100% - var(--top-bar-height));
            background: var(--panel-bg);
            border-left: 1px solid var(--border-color);
            z-index: 150;
            transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: -4px 0 10px rgb(0 0 0 / 0.1);
            padding: 20px;
            box-sizing: border-box;
        }

        .side-panel.open {
            right: 0;
        }

        .side-panel .panel-header {
            margin-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-color);
        }

        .side-panel .prop-group {
            margin-bottom: 20px;
        }

        .side-panel input, .side-panel select {
            width: 100%;
            margin-top: 4px;
        }

        .panel-section {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
        }

        .panel-header {
            font-weight: 600;
            font-size: 0.75rem;
            color: var(--panel-header-text);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #simulation-chart {
            flex-grow: 1;
            min-height: 250px;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            margin-bottom: 16px;
            overflow: hidden;
            transition: background-color 0.3s, border-color 0.3s;
        }

        #log-console {
            height: 200px;
            background: var(--log-bg);
            color: var(--log-text);
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            font-size: 0.75rem;
            padding: 12px;
            overflow-y: auto;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            transition: background-color 0.3s, color 0.3s, border-color 0.3s;
        }

        .log-entry {
            margin-bottom: 6px;
            line-height: 1.5;
            border-left: 2px solid transparent;
            padding-left: 8px;
        }

        .log-time { color: #64748b; margin-right: 8px; font-size: 0.7rem; }
        .log-error { color: #f87171; border-left-color: #f87171; }
        .log-info { color: #60a5fa; border-left-color: #60a5fa; }
        .log-success { color: #4ade80; border-left-color: #4ade80; }

        #toggle-rhs {
            position: absolute;
            left: -12px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            background: var(--control-bg);
            border: 1px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 30;
            box-shadow: 0 2px 4px rgb(0 0 0 / 0.1);
            color: var(--control-text);
        }

        .invalid-indicator {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #ef4444;
            color: white;
            padding: 6px 16px;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            box-shadow: 0 4px 6px -1px rgb(239 68 68 / 0.3);
            display: none;
            z-index: 50;
        }

        select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: var(--control-bg);
            font-size: 0.875rem;
            color: var(--text-color);
            outline: none;
            transition: background-color 0.3s, border-color 0.3s, color 0.3s;
        }

        select:focus {
            border-color: var(--primary-color);
            ring: 2px solid var(--primary-color);
        }

        /* Theme Switcher Styles */
        .theme-switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
        }

        .theme-switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #cbd5e1;
            transition: .4s;
            border-radius: 22px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary-color);
        }

        input:checked + .slider:before {
            transform: translateX(18px);
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="color: var(--primary-color)"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg>
            gssk-dia
        </div>
        <div class="controls">
            <select id="example-select">
                <option value="">Select Example...</option>
                <option value="basic">Basic Source-Storage-Sink</option>
                <option value="predator-prey">Lotka-Volterra</option>
                <option value="industrial">Industrial Ecosystem</option>
            </select>
            <div style="width: 1px; height: 24px; background: var(--border-color); margin: 0 8px;"></div>
            <button id="run-sim" class="primary">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                Run
            </button>
            <button id="stop-sim" style="display:none">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12"/></svg>
                Stop
            </button>
            <button id="reset-sim">Reset</button>
            <div style="width: 1px; height: 24px; background: var(--border-color); margin: 0 8px;"></div>
            <button id="toggle-symbols">Odum Symbols</button>
            <button id="export-json" title="Export to Console">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            </button>
            <button id="open-settings">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
                Settings
            </button>
            <div style="width: 1px; height: 24px; background: var(--border-color); margin: 0 8px;"></div>
            <div class="theme-switch-wrapper" style="display: flex; align-items: center; gap: 8px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #94a3b8"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                <label class="theme-switch">
                    <input type="checkbox" id="theme-toggle">
                    <span class="slider"></span>
                </label>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #94a3b8"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
            </div>
        </div>
    </header>

    <div class="main-container">
        <div id="editor-wrapper">
            <div id="invalid-msg" class="invalid-indicator">Invalid Model Configuration</div>
            <gssk-editor id="editor" symbols="odum"></gssk-editor>
        </div>

    <div id="settings-panel" class="side-panel">
        <div class="panel-header">
            Simulation Settings
            <button id="close-settings" style="padding: 0; border: none; background: none; font-size: 1.5rem; color: var(--text-color); cursor: pointer;">&times;</button>
        </div>
        <div class="panel-content">
            <div class="prop-group">
                <label>Simulation Mode</label>
                <select id="sim-mode">
                    <option value="streaming">Streaming (Real-time)</option>
                    <option value="batch">Batch (All at once)</option>
                </select>
            </div>
            <div class="prop-group">
                <label>Start Time</label>
                <input type="number" id="sim-start-time" value="0" step="0.1">
            </div>
            <div class="prop-group">
                <label>End Time</label>
                <input type="number" id="sim-end-time" value="100" step="1">
            </div>
            <div class="prop-group">
                <label>Time Step (dt)</label>
                <input type="number" id="sim-dt" value="0.1" step="0.01">
            </div>
        </div>
    </div>

    <aside id="rhs-panel">
        <div id="toggle-rhs">&rsaquo;</div>
            <div class="panel-section" id="log-section" style="height: 250px; min-height: 100px;">
                <div class="panel-header" id="log-header" style="cursor: ns-resize;">
                    Log Console
                    <button id="maximize-rhs" style="padding: 4px 8px; font-size: 0.65rem;">Maximize</button>
                </div>
                <div id="log-console" style="flex-grow: 1;">
                    <div class="log-entry"><span class="log-time">00:00:00</span> <span class="log-info">System ready.</span></div>
                </div>
            </div>
            <div class="panel-section" style="flex-grow: 1;">
                <div class="panel-header">
                    Simulation Results (Time-Series)
                </div>
                <div id="simulation-chart">
                    <svg id="chart-svg" width="100%" height="100%"></svg>
                </div>
            </div>
        </aside>
    </div>

    <script type="module" src="/src/gssk-editor.js"></script>
    <script type="module">
        import createGSSK from 'gssk';

        // Theme Toggle Logic
        const themeToggle = document.getElementById('theme-toggle');
        const currentTheme = localStorage.getItem('theme') || 'light';

        if (currentTheme === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
            themeToggle.checked = true;
            document.getElementById('editor').setAttribute('theme', 'dark');
        }

        themeToggle.addEventListener('change', (e) => {
            if (e.target.checked) {
                document.documentElement.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                document.getElementById('editor').setAttribute('theme', 'dark');
            } else {
                document.documentElement.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                document.getElementById('editor').setAttribute('theme', 'light');
            }
            updateChart(); // Refresh chart colors
        });

        import gsskUrl from 'gssk/dist/gssk.wasm?url';

        const editor = document.getElementById('editor');
        const runBtn = document.getElementById('run-sim');
        const stopBtn = document.getElementById('stop-sim');
        const resetBtn = document.getElementById('reset-sim');
        const logConsole = document.getElementById('log-console');
        const rhsPanel = document.getElementById('rhs-panel');
        const toggleRhs = document.getElementById('toggle-rhs');
        const maximizeRhs = document.getElementById('maximize-rhs');
        const invalidMsg = document.getElementById('invalid-msg');
        const settingsPanel = document.getElementById('settings-panel');
        const openSettingsBtn = document.getElementById('open-settings');
        const closeSettingsBtn = document.getElementById('close-settings');

        const simModeSelect = document.getElementById('sim-mode');
        const simStartTimeInput = document.getElementById('sim-start-time');
        const simEndTimeInput = document.getElementById('sim-end-time');
        const simDtInput = document.getElementById('sim-dt');

        openSettingsBtn.addEventListener('click', () => settingsPanel.classList.add('open'));
        closeSettingsBtn.addEventListener('click', () => settingsPanel.classList.remove('open'));

        function log(message, type = 'info') {
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const time = new Date().toTimeString().split(' ')[0];
            entry.innerHTML = `<span class="log-time">${time}</span> ${message}`;
            logConsole.appendChild(entry);
            logConsole.scrollTop = logConsole.scrollHeight;
        }

        toggleRhs.addEventListener('click', () => {
            const isCollapsed = rhsPanel.style.width === '0px';
            rhsPanel.style.width = isCollapsed ? 'var(--side-panel-width)' : '0px';
            toggleRhs.innerHTML = isCollapsed ? '&rsaquo;' : '&lsaquo;';
        });

        maximizeRhs.addEventListener('click', () => {
            rhsPanel.classList.toggle('maximized');
            maximizeRhs.textContent = rhsPanel.classList.contains('maximized') ? 'Restore' : 'Maximize';
        });

        // Resize Log Console
        const logHeader = document.getElementById('log-header');
        const logSection = document.getElementById('log-section');
        let isResizingLog = false;

        logHeader.addEventListener('mousedown', (e) => {
            if (e.target.tagName === 'BUTTON') return;
            isResizingLog = true;
            document.body.style.cursor = 'ns-resize';
        });

        window.addEventListener('mousemove', (e) => {
            if (!isResizingLog) return;
            const rhsRect = rhsPanel.getBoundingClientRect();
            const newHeight = e.clientY - rhsRect.top;
            if (newHeight > 100 && newHeight < rhsRect.height - 100) {
                logSection.style.height = `${newHeight}px`;
            }
        });

        window.addEventListener('mouseup', () => {
            isResizingLog = false;
            document.body.style.cursor = 'default';
        });

        const EXAMPLES = {
            basic: {
                settings: { dt: 0.1, t_start: 0, t_end: 100, method: 'euler' },
                nodes: [
                    { id: 'sun', type: 'source', value: 0, visual: { x: 100, y: 150, label: 'Sun' } },
                    { id: 'grass', type: 'storage', value: 10.0, visual: { x: 300, y: 150, label: 'Grass Biomass', capacity: 100.0 } },
                    { id: 'heat_sink', type: 'sink', value: 0, visual: { x: 500, y: 150, label: 'Heat Sink' } }
                ],
                edges: [
                    { id: 'production', origin: 'sun', target: 'grass', logic: 'linear', params: { k: 0.1 }, visual: { points: [], max_flow: 5.0 } },
                    { id: 'respiration', origin: 'grass', target: 'heat_sink', logic: 'linear', params: { k: 0.05 }, visual: { points: [], max_flow: 2.0 } }
                ]
            },
            'predator-prey': {
                settings: { dt: 0.1, t_start: 0, t_end: 100, method: 'rk4' },
                nodes: [
                    { id: 'prey', type: 'storage', value: 50.0, visual: { x: 200, y: 200, label: 'Prey', capacity: 200 } },
                    { id: 'predator', type: 'storage', value: 10.0, visual: { x: 500, y: 200, label: 'Predator', capacity: 100 } },
                    { id: 'sink', type: 'sink', value: 0, visual: { x: 350, y: 400, label: 'Loss' } }
                ],
                edges: [
                    { id: 'transfer', origin: 'prey', target: 'predator', logic: 'linear', params: { k: 0.1 }, visual: { points: [] } },
                    { id: 'loss', origin: 'predator', target: 'sink', logic: 'linear', params: { k: 0.05 }, visual: { points: [] } }
                ]
            },
            industrial: {
                settings: { dt: 0.1, t_start: 0, t_end: 100, method: 'euler' },
                nodes: [
                    { id: 'resource', type: 'source', value: 0, visual: { x: 100, y: 200, label: 'Raw Resource' } },
                    { id: 'factory', type: 'storage', value: 20.0, visual: { x: 300, y: 200, label: 'Production', capacity: 1000 } },
                    { id: 'market', type: 'storage', value: 5.0, visual: { x: 500, y: 200, label: 'Inventory', capacity: 500 } },
                    { id: 'waste', type: 'sink', value: 0, visual: { x: 700, y: 200, label: 'Environment' } }
                ],
                edges: [
                    { id: 'input', origin: 'resource', target: 'factory', logic: 'linear', params: { k: 0.5 }, visual: { points: [] } },
                    { id: 'output', origin: 'factory', target: 'market', logic: 'linear', params: { k: 0.2 }, visual: { points: [] } },
                    { id: 'sale', origin: 'market', target: 'waste', logic: 'linear', params: { k: 0.3 }, visual: { points: [] } },
                    { id: 'loss', origin: 'factory', target: 'waste', logic: 'linear', params: { k: 0.05 }, visual: { points: [] } }
                ]
            }
        };

        const exampleSelect = document.getElementById('example-select');
        exampleSelect.addEventListener('change', (e) => {
            const val = e.target.value;
            if (val && EXAMPLES[val]) {
                stopSimulation();
                loadModelWithSettings(EXAMPLES[val]);
                log(`Loaded example: ${val}`);
            }
        });

        function loadModelWithSettings(model) {
            editor.loadModel(model);
            if (model.settings) {
                if (model.settings.t_start !== undefined) simStartTimeInput.value = model.settings.t_start;
                if (model.settings.t_end !== undefined) simEndTimeInput.value = model.settings.t_end;
                if (model.settings.dt !== undefined) simDtInput.value = model.settings.dt;
            }
        }

        // Load initial example
        loadModelWithSettings(EXAMPLES.basic);

        let gsskModule;
        let kernelPtr = 0;
        let isSimulating = false;
        let simInterval = null;
        let chartData = [];
        let simTime = 0;
        let storageNodeIds = new Set();

        async function initGssk() {
            try {
                gsskModule = await createGSSK({
                    locateFile: (path) => path.endsWith('.wasm') ? gsskUrl : path
                });
                log('GSSK WASM Runtime loaded.', 'success');
            } catch (e) {
                log('Failed to load GSSK WASM: ' + e.message, 'error');
            }
        }
        initGssk();

        editor.addEventListener('change', (e) => {
            const isInvalid = editor.hasAttribute('invalid');
            invalidMsg.style.display = isInvalid ? 'block' : 'none';
            if (isSimulating) stopSimulation();
        });

        runBtn.addEventListener('click', startSimulation);
        stopBtn.addEventListener('click', stopSimulation);
        resetBtn.addEventListener('click', resetSimulation);

        function startSimulation() {
            if (editor.hasAttribute('invalid')) {
                log('Cannot run simulation: Model is invalid.', 'error');
                return;
            }

            try {
                const model = editor.getJson();
                // Apply settings from UI
                if (!model.settings) model.settings = {};
                model.settings.t_start = parseFloat(simStartTimeInput.value);
                model.settings.t_end = parseFloat(simEndTimeInput.value);
                model.settings.dt = parseFloat(simDtInput.value);

                const jsonStr = JSON.stringify(model);
                const bytes = gsskModule.lengthBytesUTF8(jsonStr) + 1;
                const ptr = gsskModule._malloc(bytes);
                gsskModule.stringToUTF8(jsonStr, ptr, bytes);

                if (kernelPtr) gsskModule._GSSK_Free(kernelPtr);
                kernelPtr = gsskModule._GSSK_Init(ptr);
                gsskModule._free(ptr);

                if (kernelPtr === 0) {
                    throw new Error('Kernel initialization failed.');
                }

                chartData = [];
                simTime = model.settings.t_start;
                storageNodeIds = new Set(model.nodes.filter(n => n.type === 'storage').map(n => n.id));

                const mode = simModeSelect.value;
                if (mode === 'batch') {
                    runBatch(model.settings);
                } else {
                    log('Simulation started (streaming).', 'success');
                    isSimulating = true;
                    runBtn.style.display = 'none';
                    stopBtn.style.display = 'flex';
                    simInterval = setInterval(() => step(model.settings.dt, model.settings.t_end), 50);
                }
            } catch (e) {
                log('Simulation error: ' + e.message, 'error');
            }
        }

        function runBatch(settings) {
            log('Running batch simulation...', 'info');
            const dt = settings.dt;
            const t_end = settings.t_end;

            while (simTime < t_end) {
                gsskModule._GSSK_Step(kernelPtr, dt);
                simTime += dt;
                recordState(simTime);
            }

            updateVisualsFromState();
            updateChart();
            log('Batch simulation complete.', 'success');
        }

        function step(dt, t_end) {
            if (!isSimulating || !kernelPtr) return;

            gsskModule._GSSK_Step(kernelPtr, dt);
            simTime += dt;

            updateVisualsFromState();
            recordState(simTime);
            updateChart();

            if (simTime >= t_end) {
                stopSimulation();
                log('Simulation reached end time.', 'success');
            }
        }

        function recordState(time) {
            const statePtr = gsskModule._GSSK_GetState(kernelPtr);
            const size = gsskModule._GSSK_GetStateSize(kernelPtr);
            const state = gsskModule.HEAPF64.subarray(statePtr / 8, statePtr / 8 + size);

            const entry = { time };
            for (let i = 0; i < size; i++) {
                const idPtr = gsskModule._GSSK_GetNodeID(kernelPtr, i);
                const id = gsskModule.UTF8ToString(idPtr);
                if (storageNodeIds.has(id)) {
                    entry[id] = state[i];
                }
            }
            chartData.push(entry);
        }

        function updateVisualsFromState() {
            const statePtr = gsskModule._GSSK_GetState(kernelPtr);
            const size = gsskModule._GSSK_GetStateSize(kernelPtr);
            const state = gsskModule.HEAPF64.subarray(statePtr / 8, statePtr / 8 + size);

            const stateMap = {};
            for (let i = 0; i < size; i++) {
                const idPtr = gsskModule._GSSK_GetNodeID(kernelPtr, i);
                const id = gsskModule.UTF8ToString(idPtr);
                stateMap[id] = state[i];
            }
            editor.updateState(stateMap);
        }

        function stopSimulation() {
            isSimulating = false;
            clearInterval(simInterval);
            runBtn.style.display = 'flex';
            stopBtn.style.display = 'none';
            log('Simulation stopped.');
        }

        function resetSimulation() {
            stopSimulation();
            if (kernelPtr) {
                gsskModule._GSSK_Free(kernelPtr);
                kernelPtr = 0;
            }
            log('Simulation reset.');
            // Reload model to editor to reset values
            editor.loadModel(editor.getJson());
            chartData = [];
            updateChart();
        }

        // --- Charting Logic ---
        const chartSvg = document.getElementById('chart-svg');
        function updateChart() {
            if (chartData.length === 0) {
                chartSvg.innerHTML = '';
                return;
            }

            const width = chartSvg.clientWidth || 300;
            const height = chartSvg.clientHeight || 250;
            const padding = 30;

            const model = editor.getJson();
            const storageNodes = model.nodes.filter(n => n.type === 'storage');
            if (storageNodes.length === 0) return;

            let minX = 0;
            let maxX = Math.max(1, chartData[chartData.length - 1].time);
            let minY = 0;
            let maxY = 0;

            chartData.forEach(d => {
                storageNodes.forEach(n => {
                    if (d[n.id] > maxY) maxY = d[n.id];
                });
            });
            if (maxY === 0) maxY = 100;
            maxY *= 1.1;

            const scaleX = (x) => padding + (x - minX) / (maxX - minX || 1) * (width - 2 * padding);
            const scaleY = (y) => height - padding - (y / maxY) * (height - 2 * padding);

            let html = '';

            // Grid lines
            const ticks = 5;
            for (let i = 0; i <= ticks; i++) {
                const y = padding + i * (height - 2 * padding) / ticks;
                const val = (maxY * (ticks - i) / ticks).toFixed(1);
                html += `
                    <line x1="${padding}" y1="${y}" x2="${width - padding}" y2="${y}" stroke="var(--chart-grid)" stroke-width="1" />
                    <text x="${padding - 5}" y="${y + 3}" text-anchor="end" font-size="8" fill="var(--chart-tick)">${val}</text>
                `;
            }

            html += `
                <line x1="${padding}" y1="${height - padding}" x2="${width - padding}" y2="${height - padding}" stroke="var(--chart-axis)" />
                <line x1="${padding}" y1="${padding}" x2="${padding}" y2="${height - padding}" stroke="var(--chart-axis)" />
                <text x="${width/2}" y="${height - 5}" text-anchor="middle" font-size="10" fill="var(--chart-tick)">Time (s)</text>
            `;

            const colors = ['#3b82f6', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6'];
            storageNodes.forEach((n, i) => {
                const color = colors[i % colors.length];
                let points = chartData.map(d => `${scaleX(d.time)},${scaleY(d[n.id])}`).join(' ');
                html += `<polyline points="${points}" fill="none" stroke="${color}" stroke-width="2" />`;
                html += `<text x="${padding + 5}" y="${padding + 12 * (i + 1)}" fill="${color}" font-size="10" font-weight="600">${n.visual.label || n.id}</text>`;
            });

            chartSvg.innerHTML = html;
        }

        window.addEventListener('resize', updateChart);

        document.getElementById('toggle-symbols').addEventListener('click', () => {
            const current = editor.getAttribute('symbols');
            const next = current === 'odum' ? 'generic' : 'odum';
            editor.setAttribute('symbols', next);
            document.getElementById('toggle-symbols').textContent = next === 'odum' ? 'Generic Symbols' : 'Odum Symbols';
        });

        document.getElementById('export-json').addEventListener('click', () => {
            const json = editor.getJson();
            console.log(JSON.stringify(json, null, 2));
            log('Model exported to console.');
        });
    </script>
</body>
</html>
