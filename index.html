<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSSK Editor Demo</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        header {
            padding: 10px;
            background: #2c3e50;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        gssk-editor {
            flex-grow: 1;
        }
        .controls {
            display: flex;
            gap: 10px;
        }
        button {
            padding: 5px 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <header>
        <div>GSSK Diagram Editor</div>
        <div class="controls">
            <button id="toggle-symbols">Switch to Generic</button>
            <button id="toggle-readonly">Toggle ReadOnly</button>
            <button id="run-sim">Run Simulation</button>
            <button id="export-json">Export JSON</button>
        </div>
    </header>
    <gssk-editor id="editor"></gssk-editor>
    <script type="module" src="/src/gssk-editor.js"></script>
    <script type="module">
        const editor = document.getElementById('editor');

        const initialModel = {
            nodes: [
                { id: 'sun', type: 'source', value: 0, visual: { x: 100, y: 150, label: 'Sun' } },
                { id: 'grass', type: 'storage', value: 10.0, visual: { x: 300, y: 150, label: 'Grass Biomass', capacity: 100.0 } },
                { id: 'heat_sink', type: 'sink', value: 0, visual: { x: 500, y: 150, label: 'Heat Sink' } }
            ],
            edges: [
                { id: 'production', origin: 'sun', target: 'grass', logic: 'linear', params: { k: 0.1 }, visual: { points: [[100, 150], [300, 150]], max_flow: 5.0 } },
                { id: 'respiration', origin: 'grass', target: 'heat_sink', logic: 'linear', params: { k: 0.05 }, visual: { points: [[300, 150], [500, 150]], max_flow: 2.0 } }
            ]
        };

        editor.loadModel(initialModel);

        document.getElementById('toggle-symbols').addEventListener('click', () => {
            const current = editor.getAttribute('symbols');
            const next = current === 'odum' ? 'generic' : 'odum';
            editor.setAttribute('symbols', next);
            document.getElementById('toggle-symbols').textContent = `Switch to ${current === 'odum' ? 'Odum' : 'Generic'}`;
        });

        document.getElementById('toggle-readonly').addEventListener('click', () => {
            const current = editor.hasAttribute('readonly');
            if (current) editor.removeAttribute('readonly');
            else editor.setAttribute('readonly', '');
        });

        let simInterval;
        document.getElementById('run-sim').addEventListener('click', () => {
            if (simInterval) {
                clearInterval(simInterval);
                simInterval = null;
                document.getElementById('run-sim').textContent = 'Run Simulation';
                return;
            }
            document.getElementById('run-sim').textContent = 'Stop Simulation';
            let t = 0;
            simInterval = setInterval(() => {
                const model = editor.getJson();
                const state = new Float64Array(model.nodes.length);
                model.nodes.forEach((n, i) => {
                    if (n.type === 'storage') {
                        state[i] = 50 + 40 * Math.sin(t / 10);
                    } else {
                        state[i] = 0;
                    }
                });
                editor.updateState(state);
                t++;
            }, 100);
        });

        document.getElementById('export-json').addEventListener('click', () => {
            console.log(JSON.stringify(editor.getJson(), null, 2));
            alert('JSON exported to console');
        });

        editor.addEventListener('change', (e) => {
            console.log('Model changed:', e.detail);
        });

        editor.addEventListener('node-select', (e) => {
            console.log('Node selected:', e.detail);
        });
    </script>
</body>
</html>
